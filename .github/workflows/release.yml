name: Publish versioned release

on:
  push:
    branches: [main]
    paths:
      - 'releases/*.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: missmahta-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the version snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
