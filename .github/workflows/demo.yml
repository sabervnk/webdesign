name: Verify static demo
on:
  push:
    paths:
      - 'demo/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - '.github/workflows/demo.yml'
  pull_request:
    paths:
      - 'demo/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
jobs:
  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix demo
      - run: node demo/build.mjs --test
      - run: node --test demo/exact-demo.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: classer-original-ui-demo
          path: demo/dist/
